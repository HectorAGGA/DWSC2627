<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4</title>
</head>
<body>
    <h2>50 combinaciones de la Lotería Primitiva</h2>
    <ul id="listaCombinaciones"></ul>

    <script>
        // Genera una combinación de 6 números distintos del 1 al 49
        function generarCombinacion() {
            let numeros = new Set();

            // El Set no admite repetidos, así que seguimos hasta tener 6 distintos
            while (numeros.size < 6) {
                let numero = Math.floor(Math.random() * 49) + 1;
                numeros.add(numero);
            }

            // Convertimos a array y ordenamos de menor a mayor (a - b para orden numérico)
            return [...numeros].sort((a, b) => a - b);
        }

        let ul = document.getElementById("listaCombinaciones");

        for (let i = 1; i <= 50; i++) {
            let combinacion = generarCombinacion();

            // Se muestra en la lista y también por consola
            let li = document.createElement("li");
            li.textContent = `Combinación ${i}: ${combinacion.join(" - ")}`;
            ul.appendChild(li);

            console.log(`Combinación ${i}: ${combinacion.join(" - ")}`);
        }
    </script>
</body>
</html>
