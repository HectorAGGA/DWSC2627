<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2</title>
</head>
<body>
    
    <ul id="lista"></ul>
    

    <script>
        const paises = ["España","Francia","Alemania", "Italia"]

        paises.forEach(pais => {
    const li = document.createElement("li");
    li.textContent = pais;
    lista.appendChild(li);
  });
  paises.shift();

  paises.forEach(pais => {
    const li = document.createElement("li");
    li.textContent = pais;
    lista.appendChild(li);
  });

    </script>
</body>
</html>
